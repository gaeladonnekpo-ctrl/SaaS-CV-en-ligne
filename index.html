<!DOCTYPE html>
<html lang="fr" data-theme="preset-c">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adonnekpo Setondji Gaël Fourier — Technicien en Microbiologie & Biotechnologie Alimentaire</title>
  <meta name="description"
    content="Portfolio et CV en ligne de Adonnekpo Setondji Gaël Fourier, Technicien en Microbiologie, Biotechnologie Alimentaire et Analyses Environnementales." />

  <!-- Google Fonts according to presets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600;1,700&family=DM+Serif+Display:ital@0;1&family=Fira+Code:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS CDN for instant zero-server browser preview -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            preset: {
              primary: 'var(--color-primary)',
              accent: 'var(--color-accent)',
              background: 'var(--color-bg)',
              card: 'var(--color-card)',
              textDark: 'var(--color-text-dark)',
              textMuted: 'var(--color-text-muted)',
              borderSubtle: 'var(--color-border)',
            }
          },
          fontFamily: {
            title: ['var(--font-title)', 'sans-serif'],
            dramatic: ['var(--font-dramatic)', 'serif'],
            data: ['var(--font-data)', 'monospace'],
          },
          borderRadius: {
            '2rem': '2rem',
            '2.5rem': '2.5rem',
            '3rem': '3rem',
            '4rem': '4rem',
          }
        }
      }
    };
  </script>

  <!-- GSAP 3 & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 19 & Babel Standalone for direct double-click execution in any browser -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Preset C - Signal Brut (Default for Biotechnology & Precision Laboratory) */
    :root,
    [data-theme="preset-c"] {
      --color-primary: #111111;
      --color-accent: #2563EB;
      --color-accent-hover: #1D4ED8;
      --color-accent-glow: rgba(37, 99, 235, 0.25);
      --color-bg: #F5F3EE;
      --color-card: #FFFFFF;
      --color-card-dark: #16181F;
      --color-text-dark: #111111;
      --color-text-muted: #52525B;
      --color-border: rgba(0, 0, 0, 0.08);
      --font-title: 'Space Grotesk', sans-serif;
      --font-dramatic: 'DM Serif Display', serif;
      --font-data: 'Space Mono', monospace;
    }

    [data-theme="preset-b"] {
      --color-primary: #0F0F13;
      --color-accent: #D4A843;
      --color-accent-hover: #B88E30;
      --color-accent-glow: rgba(212, 168, 67, 0.25);
      --color-bg: #F5F3EE;
      --color-card: #FFFFFF;
      --color-card-dark: #1E1E26;
      --color-text-dark: #0F0F13;
      --color-text-muted: #646470;
      --color-border: rgba(212, 168, 67, 0.15);
      --font-title: 'Inter', sans-serif;
      --font-dramatic: 'Playfair Display', serif;
      --font-data: 'JetBrains Mono', monospace;
    }

    [data-theme="preset-a"] {
      --color-primary: #1C1C1E;
      --color-accent: #E8634A;
      --color-accent-hover: #CF4E36;
      --color-accent-glow: rgba(232, 99, 74, 0.25);
      --color-bg: #FAFAFA;
      --color-card: #FFFFFF;
      --color-card-dark: #242426;
      --color-text-dark: #1C1C1E;
      --color-text-muted: #57575C;
      --color-border: rgba(0, 0, 0, 0.07);
      --font-title: 'Plus Jakarta Sans', sans-serif;
      --font-dramatic: 'Cormorant Garamond', serif;
      --font-data: 'IBM Plex Mono', monospace;
    }

    [data-theme="preset-d"] {
      --color-primary: #0A0A14;
      --color-accent: #7B61FF;
      --color-accent-hover: #6345F5;
      --color-accent-glow: rgba(123, 97, 255, 0.35);
      --color-bg: #F0EFF4;
      --color-card: #FFFFFF;
      --color-card-dark: #141424;
      --color-text-dark: #0A0A14;
      --color-text-muted: #606075;
      --color-border: rgba(123, 97, 255, 0.15);
      --font-title: 'Sora', sans-serif;
      --font-dramatic: 'Instrument Serif', serif;
      --font-data: 'Fira Code', monospace;
    }

    html {
      scroll-behavior: smooth;
      font-family: var(--font-title);
      color: var(--color-text-dark);
      background-color: var(--color-bg);
      overflow-x: hidden;
    }

    /* Global SVG Noise Overlay */
    .noise-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.05;
    }

    /* Micro-Interactions */
    .btn-magnetic {
      transition: transform 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        box-shadow 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        background-color 0.2s ease;
    }

    .btn-magnetic:hover {
      transform: scale(1.03);
    }

    .btn-magnetic:active {
      transform: scale(0.98);
    }

    .hover-lift {
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        color 0.2s ease;
    }

    .hover-lift:hover {
      transform: translateY(-1px);
    }

    .card-experience {
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        box-shadow 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .card-experience:hover {
      transform: scale(1.01);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
    }

    /* Pulse animation for timeline dots */
    @keyframes pulseDot {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.4);
        opacity: 0.8;
      }
    }

    .dot-pulse {
      animation: pulseDot 2.4s infinite ease-in-out;
    }

    /* Radial pulse for green online badge */
    @keyframes statusBeacon {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }

    .online-beacon {
      animation: statusBeacon 2s infinite;
    }

    .font-dramatic {
      font-family: var(--font-dramatic);
    }

    .font-data {
      font-family: var(--font-data);
    }

    .font-title {
      font-family: var(--font-title);
    }
  </style>
</head>

<body class="selection:bg-[var(--color-accent)] selection:text-white">

  <div id="root"></div>

  <!-- SVG Global Turbulence Noise Filter -->
  <svg class="noise-overlay" aria-hidden="true">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)" />
  </svg>

  <!-- React 19 / JSX Application Component -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [currentPreset, setCurrentPreset] = useState('preset-c');
      const [isScrolled, setIsScrolled] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [skillView, setSkillView] = useState('grid');
      const [contactSent, setContactSent] = useState(false);
      const [formData, setFormData] = useState({ name: '', email: '', subject: '', message: '' });

      // Synchronize theme attribute
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', currentPreset);
      }, [currentPreset]);

      // Navbar scroll observer
      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 80);
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // GSAP Animations
      useEffect(() => {
        if (window.gsap) {
          gsap.registerPlugin(ScrollTrigger);
          const ctx = gsap.context(() => {
            gsap.from('.gsap-hero-el', {
              y: 35,
              opacity: 0,
              duration: 0.9,
              stagger: 0.12,
              ease: 'power3.out'
            });

            gsap.utils.toArray('.gsap-reveal').forEach((el) => {
              gsap.from(el, {
                scrollTrigger: {
                  trigger: el,
                  start: 'top 85%',
                  toggleActions: 'play none none none'
                },
                y: 30,
                opacity: 0,
                duration: 0.8,
                ease: 'power3.out'
              });
            });
          });
          return () => ctx.revert();
        }
      }, []);

      // Lucide icons auto-render
      useEffect(() => {
        const renderIcons = () => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        };
        renderIcons();
        const timer = setTimeout(renderIcons, 60);
        return () => clearTimeout(timer);
      }, [skillView, mobileMenuOpen, currentPreset]);

      const presets = [
        { id: 'preset-c', name: 'Signal Brut', desc: 'Tech Direct & Laboratoire (Bleu Signal)' },
        { id: 'preset-b', name: 'Nocturne Prestige', desc: 'Sombre & Raffiné (Or & Charbon)' },
        { id: 'preset-a', name: 'Architecte Minimal', desc: 'Épure & Clarté (Encre & Corail)' },
        { id: 'preset-d', name: 'Aura Digitale', desc: 'Créatif & Moderne (Violet Néon)' },
      ];

      const coreSkills = [
        { name: "Contrôle Qualité & Normes HACCP", level: 95, category: "Sécurité Alimentaire", icon: "shield-check" },
        { name: "Microbiologie & Dépistage Pathogènes", level: 92, category: "Analyses Cliniques & Agro", icon: "microscope" },
        { name: "Galerie API 20E & Antibiogrammes", level: 90, category: "Diagnostic Bactérien", icon: "flask-conical" },
        { name: "Schémas Technologiques & Production", level: 88, category: "Transformation Agroalimentaire", icon: "briefcase" },
        { name: "Analyses Eau, Sols & Impact Climat", level: 85, category: "Sciences Environnementales", icon: "globe" }
      ];

      const radarPoints = [
        { label: "Qualité & HACCP", value: 95, angle: -90 },
        { label: "Microbiologie", value: 92, angle: -18 },
        { label: "API 20E / Bioch.", value: 90, angle: 54 },
        { label: "Production Jus", value: 88, angle: 126 },
        { label: "Analyses Éco/Sols", value: 85, angle: 198 },
      ];

      const getRadarPolygon = (points, factor = 1) => {
        const cx = 150;
        const cy = 150;
        const maxR = 100;
        return points.map(p => {
          const r = (p.value / 100) * maxR * factor;
          const rad = (p.angle * Math.PI) / 180;
          const x = cx + r * Math.cos(rad);
          const y = cy + r * Math.sin(rad);
          return `${x},${y}`;
        }).join(' ');
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        setContactSent(true);
        setTimeout(() => {
          setContactSent(false);
          setFormData({ name: '', email: '', subject: '', message: '' });
        }, 4500);
      };

      return (
        <div className="relative min-h-screen text-[var(--color-text-dark)] bg-[var(--color-bg)] transition-colors duration-500 font-title">

          {/* A. NAVBAR — "La Signature Flottante" */}
          <header className="fixed top-5 inset-x-0 z-50 flex justify-center px-4 pointer-events-none">
            <nav
              className={`pointer-events-auto transition-all duration-500 flex items-center justify-between gap-4 px-5 py-3 rounded-full border ${isScrolled
                  ? 'bg-[var(--color-bg)]/85 backdrop-blur-xl border-[var(--color-border)] shadow-xl shadow-black/5 text-[var(--color-text-dark)]'
                  : 'bg-black/50 backdrop-blur-md border-white/10 text-white shadow-2xl'
                }`}
              style={{ width: 'min(96%, 1020px)' }}
            >
              {/* Logo / Initials */}
              <a href="#hero" className="flex items-center gap-2.5 font-bold tracking-tight text-sm md:text-base group">
                <span className="w-8 h-8 rounded-full bg-[var(--color-accent)] text-white flex items-center justify-center text-xs font-data font-bold shadow-md shadow-[var(--color-accent-glow)] group-hover:scale-105 transition-transform">
                  GF
                </span>
                <span className="hidden sm:inline font-data tracking-wider font-semibold text-xs uppercase">
                  G.F. ADONNEKPO
                </span>
              </a>

              {/* Nav Links */}
              <div className="hidden md:flex items-center gap-7 text-xs font-medium tracking-wide">
                <a href="#a-propos" className="hover-lift hover:text-[var(--color-accent)] transition-colors">À propos</a>
                <a href="#experience" className="hover-lift hover:text-[var(--color-accent)] transition-colors">Expériences</a>
                <a href="#competences" className="hover-lift hover:text-[var(--color-accent)] transition-colors">Compétences</a>
                <a href="#formations" className="hover-lift hover:text-[var(--color-accent)] transition-colors">Formations</a>
                <a href="#contact" className="hover-lift hover:text-[var(--color-accent)] transition-colors">Contact</a>
              </div>

              {/* Preset Selector & CTA */}
              <div className="flex items-center gap-2.5">
                {/* Aesthetic Preset Switcher */}
                <div className="relative group">
                  <button
                    title="Changer de preset esthétique"
                    className="px-2.5 py-1.5 rounded-full text-[11px] font-data border border-current/20 flex items-center gap-1.5 opacity-85 hover:opacity-100 hover:border-[var(--color-accent)] transition-all"
                  >
                    <i data-lucide="sparkles" className="w-3 h-3 text-[var(--color-accent)]"></i>
                    <span className="hidden lg:inline capitalize">
                      {presets.find(p => p.id === currentPreset)?.name}
                    </span>
                  </button>

                  <div className="absolute right-0 top-full mt-2 w-64 p-2 bg-[var(--color-card)] text-[var(--color-text-dark)] rounded-2xl shadow-2xl border border-[var(--color-border)] opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-all duration-200 z-50">
                    <div className="text-[10px] uppercase font-data tracking-wider text-[var(--color-text-muted)] px-3 py-1 font-semibold border-b border-black/5 mb-1">
                      Système Visuel &amp; Preset
                    </div>
                    {presets.map(p => (
                      <button
                        key={p.id}
                        onClick={() => setCurrentPreset(p.id)}
                        className={`w-full text-left px-3 py-2 rounded-xl text-xs transition-all flex flex-col ${currentPreset === p.id
                            ? 'bg-[var(--color-accent)] text-white font-semibold'
                            : 'hover:bg-black/5 text-[var(--color-text-dark)]'
                          }`}
                      >
                        <span className="font-medium">{p.name}</span>
                        <span className={`text-[10px] ${currentPreset === p.id ? 'text-white/80' : 'text-[var(--color-text-muted)]'}`}>
                          {p.desc}
                        </span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* CTA Button */}
                <a
                  href="#cv-download"
                  className="btn-magnetic px-4 py-1.5 rounded-full bg-[var(--color-accent)] text-white text-xs font-semibold shadow-md shadow-[var(--color-accent-glow)] flex items-center gap-1.5"
                >
                  <i data-lucide="download" className="w-3.5 h-3.5"></i>
                  <span>CV</span>
                </a>

                {/* Mobile hamburger */}
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="md:hidden p-1.5 rounded-full hover:bg-white/10 transition-colors"
                  aria-label="Menu"
                >
                  <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-5 h-5"></i>
                </button>
              </div>
            </nav>

            {/* Mobile Dropdown */}
            {mobileMenuOpen && (
              <div className="pointer-events-auto absolute top-20 inset-x-4 bg-[var(--color-card)] text-[var(--color-text-dark)] p-6 rounded-3xl shadow-2xl border border-[var(--color-border)] flex flex-col gap-4 text-sm font-medium z-50">
                <a onClick={() => setMobileMenuOpen(false)} href="#a-propos" className="py-2 border-b border-black/5">À propos</a>
                <a onClick={() => setMobileMenuOpen(false)} href="#experience" className="py-2 border-b border-black/5">Expériences</a>
                <a onClick={() => setMobileMenuOpen(false)} href="#competences" className="py-2 border-b border-black/5">Compétences</a>
                <a onClick={() => setMobileMenuOpen(false)} href="#formations" className="py-2 border-b border-black/5">Formations</a>
                <a onClick={() => setMobileMenuOpen(false)} href="#contact" className="py-2">Contact</a>

                <div className="pt-3 border-t border-black/5">
                  <span className="text-xs font-data text-[var(--color-text-muted)] block mb-2">Choisir une esthétique :</span>
                  <div className="grid grid-cols-2 gap-2">
                    {presets.map(p => (
                      <button
                        key={p.id}
                        onClick={() => { setCurrentPreset(p.id); setMobileMenuOpen(false); }}
                        className={`p-2 rounded-xl text-xs font-data text-center border ${currentPreset === p.id
                            ? 'bg-[var(--color-accent)] text-white border-transparent'
                            : 'border-black/10'
                          }`}
                      >
                        {p.name}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </header>

          {/* B. SECTION HERO — "La Première Impression" (100dvh) */}
          <section
            id="hero"
            className="relative min-h-screen flex flex-col items-center justify-center text-center px-4 sm:px-6 pt-24 pb-16 overflow-hidden bg-[var(--color-primary)] text-white"
          >
            {/* Laboratory / Scientific Texture with heavy dark gradient */}
            <div
              className="absolute inset-0 z-0 bg-cover bg-center opacity-25 filter contrast-125 brightness-90 mix-blend-luminosity scale-105"
              style={{
                backgroundImage: `url('https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?auto=format&fit=crop&w=2000&q=80')`
              }}
            />
            <div className="absolute inset-0 z-0 bg-gradient-to-b from-[var(--color-primary)]/80 via-[var(--color-primary)]/90 to-[var(--color-primary)]" />

            {/* Glow ambient light */}
            <div
              className="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[550px] h-[550px] rounded-full blur-[140px] pointer-events-none opacity-25"
              style={{ background: 'var(--color-accent)' }}
            />

            <div className="relative z-10 max-w-4xl mx-auto flex flex-col items-center">

              {/* Profile Photo Badge with Accent Border (120-160px) */}
              <div className="gsap-hero-el relative mb-7 group">
                <div className="w-32 h-32 md:w-36 md:h-36 rounded-full border-2 border-[var(--color-accent)] p-1.5 shadow-2xl shadow-[var(--color-accent-glow)] transition-transform duration-500 group-hover:scale-105 bg-white/5 backdrop-blur-sm">
                  <div className="w-full h-full rounded-full bg-gradient-to-tr from-[#1E293B] to-[#334155] flex flex-col items-center justify-center text-center overflow-hidden relative">
                    <span className="font-data text-2xl md:text-3xl font-extrabold tracking-widest text-white">
                      AG
                    </span>
                    <span className="text-[10px] font-data uppercase tracking-tighter text-blue-300/80">
                      BIO · LAB
                    </span>
                    <div className="absolute inset-0 bg-gradient-to-t from-[var(--color-accent)]/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity" />
                  </div>
                </div>

                {/* Status tag */}
                <div className="absolute -bottom-2 inset-x-0 flex justify-center">
                  <span className="px-3 py-0.5 rounded-full bg-[var(--color-card-dark)] border border-white/20 text-[10px] font-data tracking-wider text-emerald-400 flex items-center gap-1.5 shadow-lg">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 online-beacon" />
                    DISPONIBLE
                  </span>
                </div>
              </div>

              {/* Name - Sans Gras Massif */}
              <h1 className="gsap-hero-el text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold tracking-tight uppercase leading-[1.08] text-white">
                ADONNEKPO <br className="hidden sm:inline" />
                <span className="text-white/90">SETONDJI GAEL</span> FOURIER
              </h1>

              {/* Title - Serif Italique Élégant */}
              <p className="gsap-hero-el mt-4 sm:mt-5 text-xl sm:text-2xl md:text-3xl italic font-dramatic text-[var(--color-accent)] tracking-normal max-w-2xl font-light">
                Technicien en Microbiologie &amp; Biotechnologie Alimentaire
              </p>

              {/* 3 Stats in Monospace */}
              <div className="gsap-hero-el mt-6 flex flex-wrap items-center justify-center gap-y-2 gap-x-4 text-xs md:text-sm font-data text-white/70 tracking-wider">
                <span className="flex items-center gap-1.5 text-white">
                  <span className="text-[var(--color-accent)] font-bold">3+ ANS</span> D'EXPÉRIENCE
                </span>
                <span className="text-white/30 hidden sm:inline">|</span>
                <span className="flex items-center gap-1.5 text-white">
                  <span className="text-[var(--color-accent)] font-bold">6+ PROJETS</span> &amp; MISSIONS
                </span>
                <span className="text-white/30 hidden sm:inline">|</span>
                <span className="flex items-center gap-1.5 text-white">
                  <i data-lucide="map-pin" className="w-3.5 h-3.5 text-[var(--color-accent)] inline"></i>
                  COTONOU, BÉNIN
                </span>
              </div>

              {/* Two CTA Buttons under stats */}
              <div className="gsap-hero-el mt-10 flex flex-wrap items-center justify-center gap-4">
                <a
                  href="#cv-download"
                  className="btn-magnetic px-8 py-3.5 rounded-full bg-[var(--color-accent)] text-white text-sm font-semibold tracking-wide shadow-xl shadow-[var(--color-accent-glow)] flex items-center gap-2 hover:bg-[var(--color-accent-hover)]"
                >
                  <i data-lucide="download" className="w-4 h-4"></i>
                  <span>Télécharger CV</span>
                </a>
